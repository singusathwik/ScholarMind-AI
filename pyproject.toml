[project]
name = "scholarmind-ai"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
description = "Reproducible scientific literature retrieval"
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
