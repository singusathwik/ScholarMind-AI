services:
  backend:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      SCHOLARMIND_INDEX_DIR: /app/indexes/scifact
      SCHOLARMIND_CORS_ORIGINS: '["http://localhost:8080"]'
      OMP_NUM_THREADS: "4"
    volumes:
      - ./indexes:/app/indexes:ro
      - ./experiments/results:/app/experiments/results:ro
      - model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; assert json.load(urllib.request.urlopen('http://localhost:8000/api/health'))['index_ready']"]
      interval: 30s
      timeout: 10s
      retries: 3
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  model-cache:
